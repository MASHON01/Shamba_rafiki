# Shamba Rafiki - local/kiosk composition.
#
# Two services, matching the real architecture:
#   backend      the FastAPI app (this repo's Dockerfile)
#   llama-server the LLM, run from the llama.cpp build (option B: separate)
#
# The llama-server service is provided as a template and is commented
# out by default, because it needs a built llama-server binary and a
# GGUF model, which live on the host (built by scripts/setup_local.sh),
# not in this repo. Uncomment and adjust once you have both. See
# docs/DEPLOYMENT.md.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: shamba-rafiki-backend:latest
    container_name: shamba-backend
    ports:
      - "8000:8000"
    environment:
      # Point the backend at the llama-server service. When running the
      # llama-server container below, use http://llama-server:8080.
      LLM_SERVER_URL: "http://host.docker.internal:8080"
      APP_ENV: "production"
      DEBUG: "false"
    volumes:
      # Persist the corpus/index/models on the host so they survive
      # container restarts and are built once, offline.
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    extra_hosts:
      # Lets the container reach a llama-server running on the host.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # --- llama-server (LLM) : template, enable when you have a GGUF ------
  # Build llama.cpp on the host first (scripts/setup_local.sh), then
  # either run llama-server directly on the host (the default, matching
  # the kiosk) OR containerize it here.
  #
  # llama-server:
  #   image: ghcr.io/ggerganov/llama.cpp:server
  #   container_name: shamba-llama
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     - ./models:/models
  #   command: >
  #     -m /models/llama.gguf
  #     --host 0.0.0.0 --port 8080
  #     -c 4096 -t 8
  #   restart: unless-stopped